[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paradigm-reflex"
version = "0.2.0"
description = "Continual reflex compilation for adaptive systems"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fabien Polly" }]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
research = [
  "jupyter>=1.0",
  "matplotlib>=3.8",
  "pandas>=2.2",
  "pytest>=8.0",
  "nbformat>=5.10",
]

dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
paradigm = "paradigm.cli:main"

[project.urls]
Repository = "https://github.com/infinition/paradigm"
Research = "https://arxiv.org/search/cs?query=Polly%2C+F&searchtype=author&abstracts=show&order=-announced_date_first&size=50"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
